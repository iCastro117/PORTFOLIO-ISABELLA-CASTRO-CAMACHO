<svg width="480" height="100" viewBox="0 0 480 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="View Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6fb5"/>
      <stop offset="100%" stop-color="#2f5a98"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="460" height="80" rx="40" fill="#5a8bd6" opacity=".35" filter="url(#glow)"/>
  <rect x="10" y="10" width="460" height="80" rx="40" fill="url(#bg)" stroke="#8fb4ee" stroke-opacity=".8" stroke-width="1.6"/>

  <text x="240" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" letter-spacing="2" fill="#ffffff">VIEW PORTFOLIO</text>

  <g transform="translate(388, 38)">
    <circle cx="12" cy="12" r="14" fill="#ffffff" fill-opacity=".18"/>
    <path d="M6 12 H18 M13 7 L18 12 L13 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
